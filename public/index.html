<!doctype html>
<html lang="da" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jedi Data Archives</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
  </head>
  <body>
    <main class="container py-5">
      <h1 class="mb-4">Jedi Data Archives</h1>
      <form id="character-form" class="row g-2 mb-4">
        <div class="col-12 col-md">
          <label for="name" class="form-label">Navn</label>
          <input id="name" name="name" class="form-control" required>
        </div>
        <div class="col-12 col-md">
          <label for="role" class="form-label">Rolle</label>
          <select id="role" name="role" class="form-select">
            <option>Jedi</option>
            <option>Sith</option>
            <option>Rebel</option>
            <option>Smuggler</option>
          </select>
        </div>
        <div class="col-12 col-md">
          <label for="planet" class="form-label">Planet</label>
          <input id="planet" name="planet" class="form-control" required>
        </div>
        <div class="col-12 col-md-auto d-flex align-items-end">
          <button type="submit" class="btn btn-primary w-100">Opret</button>
        </div>
      </form>
      <p id="error-message" class="alert alert-danger" role="alert" hidden></p>
      <ul id="character-list" class="list-group"></ul>
    </main>
    <script src="main.js"></script>
  </body>
</html>
